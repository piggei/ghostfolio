map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8099;
    server_name _;
    absolute_redirect off;

    # Rewrite only the Ghostfolio PWA manifest for Home Assistant Ingress.
    location ~ ^/api/assets/[^/]+/site\.webmanifest$ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        proxy_set_header Accept-Encoding "";

        sub_filter_types application/json;
        sub_filter_once off;

        sub_filter '"start_url": "/' '"start_url": "$http_x_ingress_path/';
        sub_filter '"src": "/assets/' '"src": "$http_x_ingress_path/assets/';
    }

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        proxy_redirect / $http_x_ingress_path/;

        proxy_set_header Accept-Encoding "";

        sub_filter_types application/javascript text/javascript text/css;
        sub_filter_once off;

        # Rewrite the Angular base path for Home Assistant Ingress.
        sub_filter 'base href="/' 'base href="$http_x_ingress_path/';

        # Rewrite absolute API paths without modifying relative URLs.
        sub_filter "'/api/" "'$http_x_ingress_path/api/";
        sub_filter '"/api/' '"$http_x_ingress_path/api/';
        sub_filter '`/api/' '`$http_x_ingress_path/api/';

        # Rewrite absolute asset paths without modifying relative URLs.
        sub_filter "'/assets/" "'$http_x_ingress_path/assets/";
        sub_filter '"/assets/' '"$http_x_ingress_path/assets/';
        sub_filter '`/assets/' '`$http_x_ingress_path/assets/';
        sub_filter "url(/assets/" "url($http_x_ingress_path/assets/";
    }
}
