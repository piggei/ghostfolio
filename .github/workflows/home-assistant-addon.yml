name: Publish Ghostfolio Home Assistant Add-on

on:
  push:
    tags:
      - 'home-assistant-addon/v*'

permissions:
  contents: read

concurrency:
  group: ghostfolio-home-assistant-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source: ${{ steps.source.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release tag and add-on version
        id: metadata
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *"\([^"]*\)"/\1/p' home-assistant-addon/config.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid add-on version'; exit 1; }
          [[ "$REF_NAME" == "home-assistant-addon/v${version}" ]] || { echo '::error::Git tag does not match add-on version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Ghostfolio source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source='ghcr.io/piggei/ghostfolio-ng@sha256:4b1b3f0663a2f583e7f81b98f76ba22a1c24338f0037ca9fc5a487bf390009f7'
          docker buildx imagetools inspect "$source" --raw > "$RUNNER_TEMP/ghostfolio-source-manifest.json"
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" '
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $arch)
            ' "$RUNNER_TEMP/ghostfolio-source-manifest.json" >/dev/null
          done
          echo "image=$source" >> "$GITHUB_OUTPUT"

      - name: Ensure final tags do not exist
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 aarch64; do
            image="ghcr.io/piggei/ghostfolio-ng-ha-${arch}:${VERSION}"
            if docker buildx imagetools inspect "$image" > /dev/null 2> "$RUNNER_TEMP/inspect-error.log"; then
              echo "::error::Destination already exists: $image"
              exit 1
            fi
            error=$(cat "$RUNNER_TEMP/inspect-error.log")
            if printf '%s' "$error" | grep -Eqi '401|403|unauthorized|denied|forbidden|timeout|429|5[0-9][0-9]'; then
              echo "::error::Registry error while checking $image"
              exit 1
            fi
            if ! printf '%s' "$error" | grep -Eqi '(^|: )not found$|manifest unknown|name unknown|404'; then
              echo "::error::Cannot establish absence of $image"
              exit 1
            fi
            echo "Destination available: $image"
          done

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish architecture candidate
        uses: docker/build-push-action@v6
        with:
          context: ./home-assistant-addon
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            GHOSTFOLIO_IMAGE=${{ needs.prepare.outputs.source }}
          tags: |
            ghcr.io/piggei/ghostfolio-ng-ha-${{ matrix.arch }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/piggei/ghostfolio
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify candidates and destination availability
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 aarch64; do
            repository="ghcr.io/piggei/ghostfolio-ng-ha-${arch}"
            candidate="${repository}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            final="${repository}:${VERSION}"
            docker buildx imagetools inspect "$candidate" --raw > "$RUNNER_TEMP/candidate-${arch}.json"
            expected_arch="$arch"
            if [ "$arch" = aarch64 ]; then expected_arch=arm64; fi
            jq -e --arg arch "$expected_arch" '
              if .manifests then
                any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $arch)
              else
                .architecture == $arch and .os == "linux"
              end
            ' "$RUNNER_TEMP/candidate-${arch}.json" >/dev/null
            if docker buildx imagetools inspect "$final" > /dev/null 2> "$RUNNER_TEMP/inspect-error.log"; then
              echo "::error::Destination already exists: $final"
              exit 1
            fi
            error=$(cat "$RUNNER_TEMP/inspect-error.log")
            if printf '%s' "$error" | grep -Eqi '401|403|unauthorized|denied|forbidden|timeout|429|5[0-9][0-9]'; then
              echo "::error::Registry error while checking $final"
              exit 1
            fi
            if ! printf '%s' "$error" | grep -Eqi '(^|: )not found$|manifest unknown|name unknown|404'; then
              echo "::error::Cannot establish absence of $final"
              exit 1
            fi
          done

      - name: Promote and verify release images
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 aarch64; do
            repository="ghcr.io/piggei/ghostfolio-ng-ha-${arch}"
            candidate="${repository}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            final="${repository}:${VERSION}"
            candidate_digest=$(docker buildx imagetools inspect "$candidate" |
              awk '/^Digest:/ {print $2}')

            if [[ ! "$candidate_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid candidate digest: $candidate"
              exit 1
            fi

            docker buildx imagetools create --tag "$final" "$candidate"

            final_digest=$(docker buildx imagetools inspect "$final" |
              awk '/^Digest:/ {print $2}')

            if [ "$candidate_digest" != "$final_digest" ]; then
              echo "::error::Digest mismatch after promotion: $final"
              exit 1
            fi

            echo "Verified OCI digest: $final_digest"
            docker buildx imagetools inspect "$final" --raw > "$RUNNER_TEMP/final-${arch}.json"
            expected_arch="$arch"
            if [ "$arch" = aarch64 ]; then expected_arch=arm64; fi
            jq -e --arg arch "$expected_arch" '
              if .manifests then
                any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $arch)
              else
                .architecture == $arch and .os == "linux"
              end
            ' "$RUNNER_TEMP/final-${arch}.json" >/dev/null
            echo "Published and verified: $final"
          done
