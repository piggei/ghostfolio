name: Publish Ghostfolio Home Assistant Add-on

on:
  workflow_call:
    inputs:
      integration_tag:
        description: Immutable integration tag
        required: true
        type: string
      source_commit:
        description: Immutable source commit
        required: true
        type: string
      source_image:
        description: Immutable source image
        required: true
        type: string
      ghostfolio_version:
        description: Immutable ghostfolio version
        required: true
        type: string
      addon_source_revision:
        description: Immutable addon source revision
        required: true
        type: string
    outputs:
      addon_version:
        description: Verified addon version
        value: ${{ jobs.publish.outputs.addon_version }}
      amd64_digest:
        description: Verified amd64 digest
        value: ${{ jobs.publish.outputs.amd64_digest }}
      aarch64_digest:
        description: Verified aarch64 digest
        value: ${{ jobs.publish.outputs.aarch64_digest }}
      metadata_commit:
        description: Verified metadata commit
        value: ${{ jobs.publish.outputs.metadata_commit }}
      publication_status:
        description: Verified publication status
        value: ${{ jobs.publish.outputs.publication_status }}
  workflow_dispatch:
    inputs:
      integration_tag:
        description: Immutable integration tag
        required: true
        type: string
      source_commit:
        description: Immutable source commit
        required: true
        type: string
      source_image:
        description: Immutable source image
        required: true
        type: string
      ghostfolio_version:
        description: Immutable ghostfolio version
        required: true
        type: string
      addon_source_revision:
        description: Immutable addon source revision
        required: true
        type: string
  push:
    tags:
      - 'home-assistant-addon/v*'

permissions:
  contents: read
  packages: read

# Repository-wide serialization, independent of caller workflow and source ref.
concurrency:
  group: ghostfolio-home-assistant-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'piggei/ghostfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
      actions: read
    outputs:
      addon_source_revision: ${{ steps.prepare.outputs.addon_source_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.addon_source_revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Verify release and persist reservation
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_INTEGRATION_TAG: ${{ inputs.integration_tag }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_SOURCE_IMAGE: ${{ inputs.source_image }}
          INPUT_GHOSTFOLIO_VERSION: ${{ inputs.ghostfolio_version }}
          INPUT_ADDON_SOURCE_REVISION: ${{ inputs.addon_source_revision }}
        run: node scripts/home-assistant-addon-workflow.mjs prepare release-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ha-plan-prepare-${{ github.run_attempt }}
          path: release-plan.json
          retention-days: 14
          if-no-files-found: error

  qualify-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.addon_source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ha-plan-prepare-${{ github.run_attempt }}
      - name: Qualify exact amd64 artifact and persist evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/home-assistant-addon-workflow.mjs qualify release-plan.json amd64
      - uses: actions/upload-artifact@v4
        with:
          name: ha-plan-amd64-${{ github.run_attempt }}
          path: release-plan.json
          retention-days: 14
          if-no-files-found: error

  qualify-aarch64:
    needs: [prepare, qualify-amd64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.addon_source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ha-plan-amd64-${{ github.run_attempt }}
      - name: Qualify exact aarch64 artifact and persist evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/home-assistant-addon-workflow.mjs qualify release-plan.json aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: ha-plan-aarch64-${{ github.run_attempt }}
          path: release-plan.json
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [prepare, qualify-aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: read
    outputs:
      addon_version: ${{ steps.publish.outputs.addon_version }}
      amd64_digest: ${{ steps.publish.outputs.amd64_digest }}
      aarch64_digest: ${{ steps.publish.outputs.aarch64_digest }}
      metadata_commit: ${{ steps.publish.outputs.metadata_commit }}
      publication_status: ${{ steps.publish.outputs.publication_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.addon_source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ha-plan-aarch64-${{ github.run_attempt }}
      - name: Promote verified digests and activate metadata
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/home-assistant-addon-workflow.mjs publish release-plan.json
