# SPDX-License-Identifier: MIT
name: Qualify immutable NG HA orchestrator (read-only)

on:
  push:
    branches: [test/ghostfolio-ng-ha-orchestrator-controller-d-ci]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact orchestrator Q
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: piggei/ghostfolio
          ref: 9c7823d1a47087aa82be6b6877efafd08d84814c
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact HA contract D
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: piggei/ghostfolio
          ref: a695d99ca3593a02c95c78f096b3ebb930fb13e8
          path: ha-contract
          persist-credentials: false
      - name: Checkout immutable qualification tools H
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: piggei/ghostfolio
          ref: 7788e4eaa028d1d748cf29870f4eebd1d646d402
          path: qualification-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ci-tooling/payload.tar.xz
            /ci-tooling/inventory.json
      - name: Checkout qualification definition from executing revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: piggei/ghostfolio
          ref: ${{ github.workflow_sha }}
          path: qualification-harness
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/ghostfolio-ng-ha-qualification.yml
            /scripts/ghostfolio-ng-ha-qualification.test.mjs
      - name: Verify independent hash pins before running bundled code
        shell: bash
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C qualification-harness rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git -C qualification-tools rev-parse HEAD)" = 7788e4eaa028d1d748cf29870f4eebd1d646d402
          test "$(git rev-parse HEAD)" = 9c7823d1a47087aa82be6b6877efafd08d84814c
          test "$(git -C ha-contract rev-parse HEAD)" = a695d99ca3593a02c95c78f096b3ebb930fb13e8
          git rev-parse HEAD
          git -C ha-contract rev-parse HEAD
          git -C qualification-harness rev-parse HEAD
          printf '%s  %s\n' \
            '2cf360792e94f46da9f535340d9d9f2aace5ecc76b7aaaefb9fd1d418f992853' 'qualification-tools/ci-tooling/payload.tar.xz' \
            '3895a4c333a6b2bca1e5c3370c9af5b5ff17393e3e70d5f7bb022301358279c5' 'qualification-tools/ci-tooling/inventory.json' \
            '5151e65620b943af99746988f81a3682ab7d6b2f85c7fb2778996857a2bfb723' 'qualification-harness/scripts/ghostfolio-ng-ha-qualification.test.mjs' \
            | sha256sum --check --strict
          bundle="$RUNNER_TEMP/ha-ci-tools"
          test ! -e "$bundle"
          mkdir "$bundle"
          tar -xJf qualification-tools/ci-tooling/payload.tar.xz --no-same-owner --no-same-permissions -C "$bundle"
          "$bundle/bin/node" "$bundle/wrappers/verify-inventory.mjs" "$bundle" qualification-tools/ci-tooling/inventory.json
          "$bundle/bin/node" --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.versions.node, '22.23.4'); console.log(process.version)"
      - name: Orchestrator tests (110, no skips)
        shell: bash
        env:
          HA_CONTRACT_DIR: ha-contract
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ha-ci-tools/bin/node" --test --experimental-test-isolation=none scripts/ghostfolio-ng-ha-orchestrator*.test.mjs | tee "$RUNNER_TEMP/orchestrator.tap"
          grep -qx '# tests 110' "$RUNNER_TEMP/orchestrator.tap"
          grep -qx '# pass 110' "$RUNNER_TEMP/orchestrator.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/orchestrator.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/orchestrator.tap"
          grep -qx '# cancelled 0' "$RUNNER_TEMP/orchestrator.tap"
          grep -qx '# todo 0' "$RUNNER_TEMP/orchestrator.tap"
      - name: HA regressions (231, no skips)
        working-directory: ha-contract
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ha-ci-tools/bin/node" --test --experimental-test-isolation=none scripts/home-assistant-addon-*.test.mjs | tee "$RUNNER_TEMP/ha.tap"
          grep -qx '# tests 231' "$RUNNER_TEMP/ha.tap"
          grep -qx '# pass 231' "$RUNNER_TEMP/ha.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/ha.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/ha.tap"
          grep -qx '# cancelled 0' "$RUNNER_TEMP/ha.tap"
          grep -qx '# todo 0' "$RUNNER_TEMP/ha.tap"
      - name: Verified harness security tests (3, no skips)
        working-directory: qualification-harness
        shell: bash
        env:
          QUALIFICATION_TOOLS_DIR: ../qualification-tools
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ha-ci-tools/bin/node" --test --experimental-test-isolation=none scripts/ghostfolio-ng-ha-qualification.test.mjs | tee "$RUNNER_TEMP/security.tap"
          grep -qx '# tests 3' "$RUNNER_TEMP/security.tap"
          grep -qx '# pass 3' "$RUNNER_TEMP/security.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/security.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/security.tap"
          grep -qx '# cancelled 0' "$RUNNER_TEMP/security.tap"
          grep -qx '# todo 0' "$RUNNER_TEMP/security.tap"
      - name: Offline static checks and state preservation
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/ha-ci-tools"
          "$bundle/bin/actionlint" --version | grep -qx '1.7.12'
          "$bundle/bin/actionlint" .github/workflows/ghostfolio-ng-ha-orchestrator.yml qualification-harness/.github/workflows/ghostfolio-ng-ha-qualification.yml
          "$bundle/bin/node" "$bundle/wrappers/yaml-unique.mjs" .github/workflows/ghostfolio-ng-ha-orchestrator.yml qualification-harness/.github/workflows/ghostfolio-ng-ha-qualification.yml
          for module in scripts/ghostfolio-ng-ha-orchestrator*.mjs qualification-harness/scripts/ghostfolio-ng-ha-qualification.test.mjs; do "$bundle/bin/node" --check "$module"; done
          "$bundle/bin/node" "$bundle/wrappers/prettier-check.mjs"
          "$bundle/bin/node" "$bundle/wrappers/prettier-check.mjs" qualification-harness/.github/workflows/ghostfolio-ng-ha-qualification.yml qualification-harness/scripts/ghostfolio-ng-ha-qualification.test.mjs
          git diff --check f54a95f6f56727662249f566472fe49283a32e56 9c7823d1a47087aa82be6b6877efafd08d84814c
          test -z "$(git -C ha-contract status --porcelain)"
          test -z "$(git -C qualification-tools status --porcelain)"
          test -z "$(git -C qualification-harness status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
