name: Test Ghostfolio Home Assistant Add-on amd64

on:
  push:
    branches: [feat/home-assistant-addon]
    paths:
      - '.github/workflows/home-assistant-addon*.yml'
      - 'home-assistant-addon/**'
      - 'tests/home-assistant-addon/**'
      - 'scripts/home-assistant-addon-*'
  workflow_dispatch:
    inputs:
      source_image:
        description: Immutable NG digest; empty uses the current release or bootstrap test pin
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ghostfolio-home-assistant-test-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Shared application and persistence qualification
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
        run: node scripts/home-assistant-addon-workflow.mjs test amd64
